diary_chars = 220
max_diaries = 30
; 冷场时把没念过的日记翻出来念（活动 diary_read），read_weight 是冷场活动里的权重，read_gap 两次朗读至少隔多少秒
read_aloud = true
read_weight = 2.0
read_gap = 1500
; 观众记忆（存在积分存档的用户记录里，只记昵称 + 行为 + 几句过滤后的短弹幕；说「忘记我」就清掉）
memory = true
quotes_max = 3
quote_min = 5
quote_max = 20
; 不是「值得记」的短弹幕（没有感叹 / 笑 / 夸）被抽中记下的概率
quote_sample = 0.08
; 欢迎老观众时带一句记忆（概率 recall_p），AI 主播回弹幕时也参考
recall = true
recall_p = 0.5
reply_memory = true
file = data/story.json
