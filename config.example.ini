; ===== config.example.ini =====
; 用法：cp config.example.ini config.ini，然后按注释修改（config.ini 已在 .gitignore，不会被提交）。
; 需要自己填的：[ai] api_key、[ops] default_room（可选）、Bark 推送密钥放 data/bark_key.txt（可选）。
; 什么都不填也能跑：没有 AI key 时用规则回复，没有 Fish key 时自动用 edge 朗读。

; ========== 怀旧 QQ 直播间 · AI 主播（猪猪侠）配置 ==========
; 改完保存，重启 ./start.sh 生效。没填 [ai] 时自动使用「规则回复」，照样能说话（只是不聪明）。

[host]
enabled = true
; 主播在群里的昵称
name = 猪猪侠
; 屏蔽词文件里「广告法极限词」那一段是否也用于检查 AI 自己的回复（默认否：只过滤观众弹幕）
filter_reply_adlaw = false
; 人设文件（可随便改）、屏蔽词文件
persona = persona.md
blocklist = blocklist.txt
; QQ秀下方显示的小字（抖音要求标明 AI 生成内容，建议保留）
label = AI虚拟主播

[ai]
; 任意 OpenAI 兼容接口。填好 base_url + model（+ api_key）即启用，三者缺一就用规则回复。
; 也可用环境变量 AI_BASE_URL / AI_API_KEY / AI_MODEL 覆盖（不想把 key 写进文件时）。
; 常用写法：
;   DeepSeek : base_url = https://api.deepseek.com/v1          model = deepseek-chat
;   通义千问 : base_url = https://dashscope.aliyuncs.com/compatible-mode/v1   model = qwen-plus
;   Kimi     : base_url = https://api.moonshot.cn/v1           model = moonshot-v1-8k
;   智谱     : base_url = https://open.bigmodel.cn/api/paas/v4  model = glm-4-flash
;   Ollama   : base_url = http://127.0.0.1:11434/v1  model = qwen2.5:7b   （api_key 随便填或留空）
base_url = https://open.bigmodel.cn/api/coding/paas/v4
; 填你自己的大模型 API Key（留空则使用规则回复）。也可用环境变量 AI_API_KEY，不要把真实 key 提交到 git
api_key =
model = glm-5.3-flash
temperature = 0.9
max_tokens = 200
timeout = 20

[behavior]
; 普通弹幕：每隔多少秒批量回复一次（被@/提问的会更快，礼物、关注最优先）
chat_interval = 3
; 欢迎新观众的最小间隔（秒）；进场很多时会合并成“欢迎 A、B、C”
welcome_interval = 3
; 没有任何互动超过多少秒，主播主动找话题暖场
idle_interval = 120
; 每句话最多多少个字（会同时作为提示词里的限制，并在代码里截断）
max_chars = 50
batch_size = 8
reply_chat = true
welcome_enters = true
thanks_gifts = true
thanks_follows = true
; 关掉则不会主动暖场
proactive = true
; true = 欢迎/答谢也让 AI 现编（更自然但更费 token）；false = 用内置模板
llm_for_events = true
; 记住最近多少轮对话
history_turns = 6
; 超过多少秒还没轮到的弹幕就不回了
stale_seconds = 30

[tts]
; fish    Fish Audio（猪猪侠音色）；失败自动回退 fallback（默认 edge）
; edge    免费（微软 Edge 在线朗读，需要联网）
; openai  OpenAI 兼容 /audio/speech（OpenAI、硅基流动、各种 CosyVoice 封装等）
; volc    火山引擎 / 豆包语音（需 appid + token）
; sovits  本地 GPT-SoVITS api_v2（声音克隆）
; custom  自定义 HTTP 接口
; browser 浏览器自带朗读（OBS 里不一定有声音）
; none    不出声，只有气泡和字幕
backend = fish
fallback = edge
; Fish Audio：密钥不要写在这里。用环境变量 FISH_API_KEY，或把 key 放进项目根目录的 .fish_api_key（不要提交）。
; 没有 key、或请求失败（401/402/429/超时/网络）时，自动改用 edge（voice 下面这条）。
fish_model = s2.1-pro-free
; Fish Audio 音色 reference_id（公开的音色模型 ID，不是密钥，可改成你自己的）。Fish 的 API key 放环境变量 FISH_API_KEY 或 .fish_api_key
fish_reference_id = 074b3a7300f64cd28e398470c51f05fb
fish_latency = balanced
fish_url = https://api.fish.audio/v1/tts
fish_timeout = 20
; edge 的音色：zh-CN-XiaoxiaoNeural(晓晓,温柔女声) zh-CN-XiaoyiNeural(晓伊,活泼) zh-CN-YunxiNeural(云希,少年男声)
;           zh-CN-YunjianNeural(云健) zh-CN-liaoning-XiaobeiNeural(辽宁话) zh-TW-HsiaoChenNeural(台湾腔)
voice = zh-CN-YunxiNeural
rate = +6%
pitch = +0Hz
volume = +0%

; --- openai ---
openai_base_url =
openai_api_key =
openai_model = tts-1
openai_voice = alloy
; --- 火山/豆包 ---
volc_appid =
volc_token =
volc_cluster = volcano_tts
volc_voice = zh_female_vv_uranus_bigtts
; --- GPT-SoVITS ---
sovits_url = http://127.0.0.1:9880/tts
sovits_ref_audio =
sovits_prompt_text =
; --- custom：POST JSON，返回音频字节；{text} 会被替换成要念的话 ---
custom_url =
custom_body = {"text": "{text}"}

[music]
; 网易云音乐「正在播放」→ ?desk=xp 页面里的千千静听 + 桌面歌词（读取方式见 backend/music.py）
enabled = true
; 只认这个播放器（留空 = 系统里当前任何在播的播放器）
; ---- bundle = com.netease.163music
bundle = 
; 仅 Windows / Linux：播放器标识（Windows AUMID / Linux MPRIS 名）的正则，留空 = 内置默认（网易云），写 any = 不过滤；macOS 不用这项
player = 
; 歌词整体偏移（秒，正数 = 歌词提前）
lyric_offset = 0
; ---- 弹幕点歌：观众发「点歌 歌名」或「点歌 歌手 歌名」，就在网易云音乐客户端里播放 ----
jukebox = true
; 队列最多多少首 / 每个观众两次点歌的间隔秒数 / 每人最多同时排几首
max_queue = 10
user_cooldown = 30
max_per_user = 2
; 允许点 VIP 歌（你的网易云账号是会员才能播）
allow_vip = true
; true = 点歌立刻开始播（打断当前歌）；false = 等当前这首放完再播点的歌
first_immediate = true
; 猪猪侠用一句话回应点歌
ack = true

[agent]
enabled = true
; 谁能指挥：everyone = 所有观众；anchor = 只有主播本人（昵称在 anchor_names 里，或和直播间主播昵称一致）；list = 只有 allow_users + anchor_names
who = everyone
; 逗号分隔。主播昵称/用户 id；deny_users 里的人永远不能指挥
anchor_names =
allow_users =
deny_users =
; 解析方式：rules = 规则解析；llm = 规则没认出来时问大模型
rules = true
llm = true
; 大模型调用方式：json = 让模型直接输出 JSON（约 1~2 秒，默认）；tools = 函数调用（约 5~6 秒，格式更稳）；auto = 先 tools，失败退回 json
llm_mode = json
; 什么样的弹幕才花一次大模型调用：keywords = 像指令的（有“打开/关/挪/挡住…”等词，或叫了主播名）；mention = 只有叫了主播名；all = 每条弹幕都问（费 token）
llm_gate = keywords
llm_timeout = 12
llm_max_tokens = 400
; 智谱 GLM 的“思考”开关：auto = bigmodel.cn 自动关（快很多）；off / on
llm_thinking = auto
; 允许 / 禁止的动作，逗号分隔，* = 全部；可以写分类 cat:window cat:music cat:app cat:desk cat:game cat:type。deny 优先
; 动作名：open_app close_window minimize_window maximize_window restore_window focus_window move_window move_away resize_window show_desktop close_all
;         tile change_wallpaper refresh_desktop arrange_icons start_menu new_item move_icon delete_icon empty_trash set_volume shutdown logoff
;         music_next music_prev music_pause music_play music_toggle song_request notepad_type qq_send calc cmd_run browse
;         game_start game_back mine_new mine_click mine_flag mine_play video_play video_toggle mir2_chat dance undo
allow_actions = *
; 默认禁止“危险”动作（关机/注销/清空回收站/删图标）。想开就从这里删掉
deny_actions = shutdown,logoff,empty_trash,delete_icon
; 一条弹幕最多连续执行几个动作 / 打字类动作最多多少字
max_actions = 4
max_text = 40
; 限速：同一观众两次指令间隔(秒) / 每分钟上限；全部观众合计的间隔 / 每分钟上限；同一观众重复同一句的去重窗口(秒)
user_cooldown = 3
user_per_min = 8
global_cooldown = 1
global_per_min = 40
dedupe_seconds = 8
; 页面里还没执行完的指令最多排几条，超过的丢弃
queue_max = 6
; 猪猪侠是否用一句话回应（走 TTS）；听不懂的指令（如“把魔兽关掉”但没开着）是否也回一句
reply = true
say_unknown = true
; 通过 qq_send 在群聊窗口里发话时，前面加的署名（{name}=点播人昵称），留空则不加
qq_send_prefix = {name}说：
; 真实“点歌 xxx”弹幕：光标是否也演一遍（点开千千静听播放列表）
song_visual = true
; ── 光标和动画 ──
; 光标移动速度（1280×720 设计画布上的像素/秒）；点击停顿(秒)；打字速度(字/秒)；两个动作之间的停顿(秒)
cursor_speed = 900
click_delay = 0.18
typing_cps = 9
step_pause = 0.25
; 光标旁边是否显示“谁在指挥”的小标签；多少秒没动作后光标淡出
show_who = true
cursor_idle_hide = 6
; ── 防滥用 ──
; 受保护的窗口：观众关掉 / 最小化 / 拖走后，restore_secs 秒后自动恢复（QQ 群聊窗口就是直播间的弹幕区，不能让它一直消失）
protect = qqchat
restore_secs = 20
; 允许“撤销”（观众说“撤销/还原刚才的”）
undo = true
; 本机测试接口 /agent/say /agent/do /agent/state（只允许 127.0.0.1 访问）
test_endpoints = true

; ───────────── 冷场时猪猪侠自己玩电脑（idle）─────────────
; 直播间安静一阵子后，猪猪侠会自己用这台“XP 电脑”：上网、扫雷、评论正在放的歌、记事本、私聊 QQ 好友、
; 开游戏菜单、整理图标、换壁纸、算个数……光标和 [agent] 是同一套，并且边做边用一句话旁白（走 TTS）。
; 观众一说话 / 一下指令，立刻停手并把自己开的窗口收拾掉。需要 [agent] enabled = true 和 ?desk=xp 页面。
[idle]
enabled = true
; 多少秒没人发弹幕才开始（礼物 / 关注也算有人，见 gifts_reset_quiet）
idle_after = 45
; 服务器启动后多少秒内不自己玩
startup_delay = 30
; 两次活动之间随机间隔（秒）；每小时最多几次
min_interval = 60
max_interval = 180
max_per_hour = 20
; 活动权重（越大越常玩，写 0 = 不玩）。可用活动：
;   browse_ie 上网逛逛 / play_minesweeper 玩扫雷 / comment_song 点评正在放的歌 / notepad_write 记事本写点东西
;   qq_chat 私聊 QQ 好友 / game_menu 看看游戏菜单 / arrange_icons 整理桌面图标 / change_wallpaper 换壁纸 / calc 按计算器
weights = browse_ie:3,play_minesweeper:3,comment_song:3,notepad_write:2,qq_chat:2,game_menu:1,arrange_icons:1,change_wallpaper:1,calc:1
; 允许 / 禁止的活动（逗号分隔，* = 全部），先看 deny 再看 allow
allow_activities = *
deny_activities =
; 同一个活动至少隔多少秒才再玩；每次活动最长多少秒（超时就收尾）
repeat_gap = 300
max_duration = 75
; ── 旁白 ──
; 是否出声（走 TTS，同时显示在群聊里）；false = 默默地玩
speak = true
; 旁白由大模型根据桌面快照 + 当前歌曲写（每个活动 1 次调用，约 2~4 秒；超时或失败用模板句子）；每句最多多少字
llm = true
llm_timeout = 8
line_chars = 28
; ── 不打扰观众 ──
; 弹幕一来就立刻停手收拾 / 礼物关注也算“有人”
stop_on_chat = true
gifts_reset_quiet = true
; 主播正在说话 / 点歌队列有歌 / 页面还在执行观众指令时，不开始新活动
wait_host_quiet = true
wait_jukebox = true
wait_agent = true
; 自己开的窗口挡住群聊 / 歌词时马上挪开或缩小；活动完（或被打断）后关掉自己开的窗口
avoid_cover = true
cleanup = true
; 是否允许自己切歌 / 暂停 / 点歌。默认 false = 永远不碰音乐，只评论
allow_music_control = false
; 光标速度 = [agent] cursor_speed × 这个倍数（<1 慢一点，更像在闲逛）
cursor_speed = 0.75
; 光标旁边显示的名字，留空 = 主播昵称
who_label =
; 上网逛的网站（域名白名单，逗号分隔）/ 扫雷点几下 / 私聊的好友名（留空 = 随机挑一个在线的）
sites = www.hao123.com,www.baidu.com,www.sina.com.cn,www.163.com,www.sohu.com,www.4399.com,www.taobao.com,www.youku.com
mine_steps = 10
friend =
; 测试接口 /agent/idle（?run=活动名 / ?stop=1 / ?reset=1 / ?cfg=键:值），需要同时 [agent] test_endpoints = true，仅限本机
test_endpoints = true

; ───────────── XP 加强包（开机画面 / 系统音效 / 气泡通知 / 蓝屏 / QQ 提示音）─────────────
; 只在 ?desk=xp 的页面里生效。开机相关的画面需要页面本身是“真实直播间页面”：?demo=1 的演示页默认跳过开机画面（?xp_boot=force 强制）。
; 想临时试某个开关不用改文件：页面 URL 加 ?xp_键=值，例如 ?xp_sounds=0 ?xp_volume=0.3 ?xp_boot=force ?xp_do=bsod（蓝屏）?xp_speed=3（把画面加快 3 倍，测试用）。
[xp]
; 总开关：false = 以下全部关掉，桌面和以前一样
enabled = true
; ── 开机 / 欢迎 / 注销 / 关机 ──
; boot：页面打开时先放 Windows XP 开机画面（原版图 + 进度条动画），boot_secs 秒；boot_edition = pro（蓝色进度条）/ home（绿色）
boot = true
boot_secs = 4.5
boot_edition = pro
; welcome：开机画面后接欢迎画面，点用户名 → “欢迎使用” + 原版开机音；welcome_secs 秒；user 留空 = 主播昵称
welcome = true
welcome_secs = 3.5
user =
; boot_cooldown：同一个浏览器 N 秒内刷新页面不重复放开机画面（OBS 刷新浏览器源 / 重启服务器不会老是黑屏）。0 = 每次都放
boot_cooldown = 900
; 开始菜单的“关闭计算机 / 注销”用不用 XP 的关机 / 注销画面（原版注销音、关机音）；false = 老的淡入黑屏
shutdown_screens = true
; 关机后是否自动重新开机（直播时别让画面一直黑着）；restart_after = 黑屏多少秒后重新开机
shutdown_restart = true
restart_after = 5
; ── 系统音效（Windows XP 原版 wav，web/xp/snd/）──
; sounds = 总开关；volume = 0~1（还要乘以任务栏小喇叭的音量）；mute = 静音
; sound_events：哪些事件响，* = 全部；可选 open close minimize restore dialog error notify balloon recycle hardware startup shutdown qq game
; sound_deny：哪些事件不响（优先级比 sound_events 高），例如 open,close,minimize,restore = 开关窗口不出声
sounds = true
volume = 0.5
mute = false
sound_events = *
sound_deny =
; ── 蓝屏彩蛋 ──
; bsod：允许蓝屏；bsod_per_hour：平均每小时随机蓝屏几次（0 = 永不随机，只有手动触发：Ctrl+Alt+Shift+B / ?xp_do=bsod）；bsod_secs：蓝屏停留多少秒，然后自动重启恢复
bsod = true
bsod_per_hour = 0.3
bsod_secs = 6
; ── 托盘气泡通知 ──
; balloons：总开关；balloon_events：hardware（发现新硬件）qq（QQ 新消息）music（网易云正在播放）tip（桌面清理提示 / 蓝屏后恢复）；balloon_secs：停留秒数
; balloon_hardware_every：“发现新硬件 / 桌面清理”随机弹出的平均间隔（秒），0 = 不随机弹
balloons = true
balloon_events = hardware,qq,music,tip
balloon_secs = 7
balloon_hardware_every = 1500
; ── QQ 提示音和托盘闪烁 ──
; qq_sounds：新消息“滴滴”、好友上线提示音（QQ2006 原版 mp3）；qq_system_sound：群里出现系统消息（送礼 / 关注）时的“敲门”声；qq_flash：群聊被最小化 / 挡住时托盘 QQ 图标闪烁
; qq_online_every：QQ 登录后随机弹出“某某上线了”的平均间隔（秒），0 = 不弹
qq_sounds = true
qq_system_sound = true
qq_flash = true
qq_online_every = 300
; ── 新软件 ──
; apps：开始菜单 / 桌面里是否显示新增的 纸牌、空当接龙、画图、控制面板
apps = true
; ── 备注：item 3 新增的冷场活动（这份 config.ini 的 [idle] 没改，下面是代码里的默认值，想改就把键加到上面的 [idle] 里）──
; [idle] weights_new = play_solitaire:2,play_freecell:2,paint_draw:2,tweak_sound:1   （纸牌 / 空当接龙 / 画图 / 控制面板声音；写 0 = 不玩）
; [idle] cards_steps = 14                                                         （纸牌 / 空当接龙每局走多少步）

; =====================================================================================
; [qq]  QQ 生态（XP 桌面里的 QQ空间 / QQ秀 / QQ宠物 / 群共享 / 窗口抖动 + 礼物触发）
;   每个部分都能单独关；也可以用网址参数临时覆盖：?qq_pet=0&qq_zone_msgs=all （键名前加 qq_）
;   需要 ?desk=xp。礼物触发需要真的收到抖音礼物事件（或用 /qq/event 测试接口灌假事件）
; 主播冷场时自己玩的 QQ 活动（qq_pet_care / qq_zone_visit / qq_show_change / qq_files_download / qq_shake）的权重在 [idle] weights_new 里（没写就用内置默认）
; =====================================================================================
[qq]
; 总开关
enabled = true
; 观众弹幕口令（喂食 / 洗澡 / 玩耍 / 换装 / 抖一下 / 写日志…）是否交给 AI 主播去执行（走 [agent]，光标真的去点）。false = 弹幕口令不管用；
; 主播冷场自己玩（[idle]）不受它管
commands = true
; ── 窗口抖动（闪屏振动）──
; shake_secs 抖多久（秒）；shake_cooldown 两次抖动最短间隔（秒，礼物 / 口令触发时遵守；群聊工具栏菜单里手动点不受限）；shake_sound 抖动时放 QQ 提示音
shake = true
shake_secs = 1.2
shake_cooldown = 6
shake_sound = true
; ── QQ秀（群聊右栏的 AI 主播形象换装；自绘的卡通配饰，不是腾讯原版美术）──
; outfit：默认穿什么：default santa cool king sailor wizard party love gentleman summer
; outfit_revert：礼物 / 口令换的装多少秒后穿回默认（0 = 不换回）；show_scene：换装时背景跟着变（雪景 / 星空…）
show = true
outfit = default
outfit_revert = 90
show_scene = true
; ── QQ宠物（任务栏上的小企鹅，帧图来自 chenboos5/QQpet-codex，见 CREDITS.md）──
; pet_name 宠物名；pet_wander 会不会在任务栏上溜达；pet_decay 饥饿 / 清洁 / 心情下降速度的倍数（0 = 不掉）；
; pet_bubbles 头顶冒对话气泡；pet_x 起始位置（设计坐标，空 = 记住上次的）；pet_panel_open 启动时自动打开宠物面板
pet = true
pet_name = 球球
pet_wander = true
pet_decay = 1.0
pet_bubbles = true
pet_x =
pet_panel_open = false
; ── QQ空间（日志 / 相册 / 留言板 / 音乐盒；数据只存在浏览器 localStorage 里）──
; zone_owner 空间主人名（空 = 用 AI 主播的名字）
; zone_msgs 弹幕变留言的方式：off 不变 / keyword 含 zone_msg_keywords 里任一个词的弹幕才变 / sample 每 zone_msg_sample 条弹幕抽 1 条 / all 全变
; zone_visitors 最近访客显示几个（来自真实观众：发过弹幕 / 送过礼 / 关注 / 进场 / 点赞的人）
; zone_music 底部背景音乐条显示正在放的歌；zone_blog 主播冷场时会不会顺手写一篇日志（[idle] qq_zone_visit）
zone = true
zone_owner =
zone_msgs = keyword
zone_msg_keywords = 留言,空间留言,踩踩,沙发,顶
zone_msg_sample = 10
zone_visitors = 30
zone_music = true
zone_blog = true
; ── 群共享（假的群文件面板，“下载”会交给桌面上的迅雷）──
; files_names：自定义文件列表，格式 名字|大小MB,名字|大小MB …（空 = 用内置示例文件）
files = true
files_names =
; ── 礼物触发 ──
; 抖音礼物 → 效果。动作写法 模块:参数：
;   pet:feed|bath|play|sleep|sing|hi|work|random   宠物反应（pet:panel 打开宠物面板，pet:name:XX 改名）
;   outfit:<套装id>|next|random|reset              QQ秀换装
;   shake                                          窗口抖动（shake:desk 整个桌面抖）
;   fx:<kind>                                      舞台特效；zone:open / zone:msg 打开空间 / 给空间留言；files:open / files:download
; gift_map 按礼物名精确匹配（名字=动作,名字=动作…）；没命中再看 gift_value_map（抖币价值：门槛=动作，取不超过礼物单价的最大门槛）；
; 都没命中用 gift_default（none = 不触发）。gift_effects = false 关掉全部礼物效果；gift_cooldown 两次触发最短间隔（秒）
gift_map = 玫瑰花=pet:feed,小心心=pet:play,啤酒=shake,加油鸭=outfit:next,飞吻=pet:bath,嘉年华=outfit:party
gift_value_map = 1=pet:play,10=pet:feed,52=outfit:next,99=shake,199=outfit:random,520=outfit:party
gift_default = pet:play
gift_effects = true
gift_cooldown = 2


; =====================================================================================
; [play]  观众互动：积分与 QQ 等级 / 弹幕投票 / 切歌投票 / 礼物特效（XP 桌面里的投票窗口、排行榜窗口、特效层）
;   账都在服务端（积分存 data/play.json，跨场保留；演示房间 demo 的数据只放内存，不落盘）。
;   页面部分需要 ?desk=xp；也可以用网址参数临时覆盖页面行为：?play_fx=0&play_badges=0（键名前加 play_）。
; =====================================================================================
[play]
; 总开关；commands：观众弹幕口令（放烟花 / 下流星雨 / 中毒 / 看排行榜…）是否交给 AI 主播执行（走 [agent]）；ai_say：投票开始 / 结果、切歌通过时 AI 主播开口说一句
enabled = true
commands = true
ai_say = true
; ── 积分 ──
; points 总开关。聊天 +chat_points（文字至少 chat_min_len 个字；同一个人两次得分至少隔 chat_gap 秒；同一句话 dup_secs 秒内重复发不算；
;   聊天 + 点赞合计每分钟最多 max_per_min 次得分、每天最多 daily_cap 分，0 = 不限）；点赞每 like_per 个赞 +like_points；
;   关注 +follow_points（每人每天一次）；礼物每个 +gift_points，再加 礼物抖币价值 × gift_value_pts（一次最多 gift_max_pts）；进场 +enter_points（每天一次，0 = 不给）
points = true
chat_points = 1
chat_min_len = 2
chat_gap = 3
dup_secs = 30
max_per_min = 6
daily_cap = 300
like_points = 1
like_per = 10
follow_points = 20
gift_points = 5
gift_value_pts = 0.5
gift_max_pts = 5000
enter_points = 0
; ── QQ 等级 ──
; 等级 = floor( sqrt(积分 / level_base) )；名字前面显示图标：4 颗星 = 1 个月亮，4 个月亮 = 1 个太阳，4 个太阳 = 1 顶皇冠（Lv.4 一个月亮，Lv.16 一个太阳，Lv.64 一顶皇冠）
; levelup_msg 升级时群里写系统消息；points_cmd 观众发「我的积分」「我的等级」时群里回他的积分和排名；badges 页面是否显示等级图标
level_base = 10
levelup_msg = true
points_cmd = true
badges = true
; 积分存档文件（相对项目目录；空 = 不存盘）和日榜保留天数
data_file = data/play.json
keep_days = 60
; ── 弹幕投票 ──
; 主播（群主）在群里发「投票 下一步干啥: 1 玩红警 2 换壁纸 3 扫雷」就开投（也可以让 AI 发起，或 [idle] 里自动发起）；观众回数字 1~N；到时间后得票最多的那个交给 agent 执行
; vote_who：谁能用弹幕发起 anchor 群主 / anyone 任何人 / off 谁都不行；vote_starters 另外允许的昵称（逗号分隔）
; vote_secs 投票时长；vote_min_votes 至少几票才算数；vote_nobody 没人投票时 skip 作废 / random 随机抽一个执行；vote_tie 平票 random 抽签 / first 取靠前
; vote_change 允许改票；vote_max_options 最多几个选项；vote_points 每人投票 +几分；vote_execute 结果真的交给 agent 去做
; vote_window 开投时自动弹出投票窗口；vote_close_secs 结果出来后窗口多久自动关
; vote_idle：冷场时 AI 自己发起投票（[idle] 活动 play_vote，选项从 vote_idle_options 里随机挑 3 个，vote_idle_secs 秒后揭晓；至少有 vote_idle_min_viewers 个最近的观众才发）
vote = true
vote_who = anchor
vote_starters =
vote_secs = 60
vote_min_votes = 1
vote_tie = random
vote_nobody = skip
vote_change = true
vote_max_options = 6
vote_points = 2
vote_execute = true
vote_window = true
vote_close_secs = 12
vote_idle = false
vote_idle_options = 玩红警,换壁纸,玩扫雷,画个太阳,下一首
vote_idle_secs = 45
vote_idle_min_viewers = 2
; ── 切歌投票 ──
; 观众发含 skip_words 的短句（≤12 字，带“别 / 不要”不算）算一票；skip_mode = count 凑够 skip_count 票 / percent 凑够最近 skip_active_secs 秒内活跃观众的 skip_percent %（至少 skip_min 票）；
; 票在 skip_window 秒内有效、换歌清零；通过后 skip_cooldown 秒内不再受理；skip_anchor_instant 群主说切歌直接切；skip_panel 显示进度小窗。
; 没有在放歌时「切歌」仍走原来的 agent 规则。关掉 skip_vote = 恢复成“任何人说切歌就切”
skip_vote = true
skip_words = 切歌,下一首,换歌,换一首,跳过,skip,不好听
skip_mode = count
skip_count = 3
skip_percent = 30
skip_min = 2
skip_window = 90
skip_active_secs = 300
skip_cooldown = 20
skip_anchor_instant = true
skip_panel = true
; ── 礼物特效（和 [qq] 的礼物映射是同一套引擎：这里的 gift_map / gift_value_map 叠在 [qq] 的上面，同名以这里为准）──
; 动作：fireworks 烟花 / meteor 流星雨 / emoji 或 emoji:🌹 满屏表情雨 / virus 或 virus:panda 假“中毒”熊猫烧香图标（几秒后自动恢复，纯视觉，不碰任何文件）/ bsod 蓝屏彩蛋 / shake 窗口抖动 / pet: outfit: 等 [qq] 的动作；
;   用 + 连起来同时触发（outfit:party+fireworks）。礼物名以直播间里显示的为准，抖币价值取“不超过礼物单价的最大门槛”。需要 [qq] enabled 和 gift_effects 开着
; fx 总开关；fx_secs 烟花 / 流星雨 / 表情雨持续秒数；fx_emoji 表情雨用哪些（逗号分隔）；fx_virus_secs 中毒持续秒数；fx_cooldown 两次特效最短间隔；fx_bsod_cooldown 蓝屏彩蛋最短间隔
fx = true
fx_secs = 6
fx_emoji = 🎉,✨,💗,🌹,🎁
fx_virus_secs = 8
fx_cooldown = 8
fx_bsod_cooldown = 120
gift_map = 烟花=fireworks,流星雨=meteor,熊猫=virus:panda,蓝屏=bsod,玫瑰花=pet:feed+emoji:🌹,小心心=pet:play+emoji:💗
gift_value_map = 88=emoji:🎉,199=outfit:random+emoji:✨,520=outfit:party+fireworks,1000=meteor,2000=fireworks+shake,3000=bsod

[ai_plus]
; ================= AI 加强包（item 6）=================
; 观众记忆 / 画面点评 / 小游戏 / 多音色 / 歌曲点评。每一块都能单独关；enabled=false 关掉整个加强包（页面、口令、闲时活动全部不生效）。
; 记忆文件在 data/memory.json（已被 .gitignore 忽略），里面没有任何原始用户 id，只有本地随机盐 + uid 的哈希。
enabled = true

; ---- 记住老观众：第一次见面时间 / 来了几次 / 最近聊的话题 / 送过的礼物 / 点过的歌 / 昵称；等级（item 5）现查现用，不另存。
; 隐私：话题会过滤手机号、网址、微信/QQ号、地址、密码等；条数 / 字数 / 人数 / 保存天数都有上限；观众发「忘记我」立刻删除并不再记录，「记住我」恢复，「你还记得我吗」让主播说说记了什么。
; 老观众（来过 ≥ memory_greet_min_visits 次、且隔了 memory_session_gap 秒以上再来）进场时，主播按记忆打招呼，不再说通用欢迎；回复聊天时也会带上这个人的记忆。
memory = true
memory_file = data/memory.json
memory_max_viewers = 2000
memory_keep_days = 90
memory_topics = 5
memory_topic_chars = 30
memory_songs = 5
memory_session_gap = 1800
memory_greet = true
memory_greet_min_visits = 2
memory_greet_gap = 20
memory_greet_llm = true
memory_in_replies = true
memory_cmd = true

; ---- 画面点评：主播根据桌面状态（打开的程序 / 放的歌 / 游戏 / 特效 / 投票 / 蓝屏）随口点评。每 screen_interval 秒一次，桌面有“事件”（新开程序、放特效、换歌、开游戏…）时 3 秒后也会说；
; 两次至少隔 screen_min_gap 秒；有人刚聊天（screen_quiet_secs）/ 主播在说话 / 闲时活动 / 游戏 / 投票进行中都不插嘴。
; screen_vision：auto / on = 让页面截一张桌面图交给视觉模型（空 screen_vision_model = 用 [ai] model；智谱 glm-5.x 同一个接口就支持图片），连续失败 3 次暂停 30 分钟、退回只用文字快照；off = 只用文字。
screen = true
screen_interval = 150
screen_min_gap = 60
screen_quiet_secs = 20
screen_events = true
screen_chars = 40
screen_vision = auto
screen_vision_model = 
screen_vision_timeout = 25
screen_cmd = true

; ---- 小游戏：成语接龙 / 猜歌名 / 脑筋急转弯。口令「玩成语接龙」「来局猜歌名」「脑筋急转弯」、投票选项、闲时自己发起、agent 动作 game_start 都能开；一次一场，game_who=anyone|anchor。
; 判分在服务端，答对加 [play] 积分（game_points；猜歌名双倍；冠军另奖 game_win_points）。「提示」要提示，群主/主播发「跳过」跳过当前题。游戏窗口自动弹出 / 结束 game_close_secs 秒后自动关。
; game_idle = 冷场（≥ game_idle_min_viewers 个活跃观众）时主播自己开一局，从 game_idle_list 里选。
game = true
game_who = anyone
game_timeout = 45
game_points = 5
game_win_points = 10
game_cooldown = 30
game_window = true
game_close_secs = 10
game_say = true
game_idle = false
game_idle_min_viewers = 2
game_idle_list = idiom,riddle,song

; 成语接龙：词库 = backend/ai6/data/idioms.tsv（pwxcoo/chinese-xinhua，MIT，见 IDIOM_LICENSE.txt）；idiom_file 可换成自己的（每行：词<TAB>拼音）。idiom_homophone = 读音相同（不看声调）也算接上；idiom_host_plays = 主播也接一个。
idiom_rounds = 8
idiom_homophone = true
idiom_host_plays = true
idiom_file = 

; 猜歌名：song_game_source = list（题库 backend/ai6/data/songs.tsv，原创描述）/ current（用正在播放那首歌的当前歌词当题）/ both。脑筋急转弯题库 riddles.tsv。三个 *_file 留空 = 用自带的。
song_game_source = both
song_game_rounds = 3
song_game_file = 
riddle_rounds = 3
riddle_file = 

; ---- 多音色：voices = 角色=后端:参数…[~回退 edge 音色]，逗号分隔。后端：edge（音色:语速:音调）/ fish（reference_id:模型）/ openai（音色）/ volc（音色）/ default（= [tts] 默认，即主播本人）。
; fish 角色走和主播同一套额度 / 熔断逻辑：失败会回退 ~ 后面的 edge 音色，熔断期内直接用 edge。voice_ctx = 说话场合:角色（vote 投票播报 / skip 切歌投票 / game 出题 / screen 画面点评 / songc 歌曲点评；角色 host = 主播本人）。voice_names = 角色在群里显示的名字。
voices = narrator=edge:zh-CN-YunjianNeural,quiz=edge:zh-CN-XiaoxiaoNeural
voice_ctx = vote:narrator,skip:narrator,game:quiz,screen:host,songc:host
voice_names = narrator=旁白,quiz=出题官

; ---- 歌曲点评：换歌后（概率 song_comment_chance，两次至少隔 song_comment_gap 秒，歌不短于 song_comment_min_secs）等 song_comment_delay 秒，挑歌词的空档（前奏 / 间奏 / 唱完）说一句，不盖住歌词；
; 等不到空档（song_comment_wait 秒）就放弃。观众点的歌默认不再点评（song_comment_requests）。口令「点评一下这首歌」随时触发。
song_comment = true
song_comment_chance = 0.5
song_comment_gap = 240
song_comment_delay = 6
song_comment_wait = 30
song_comment_chars = 40
song_comment_llm = true
song_comment_requests = false
song_comment_min_secs = 60


[ops]
; ================= 运维（item 7）=================
; 一键开播（./live.sh / live.command / live.bat）、断线重连 + 开播下播自动切换、服务看门狗、按场日志、下播复盘、手机控制面板。
; enabled=false 关掉整套（回到老行为：没开播也连弹幕、不记日志、没有面板）。每一块也能单独关。
enabled = true

; ---- 一键开播（tools/opsctl.py live）----
; 房间：命令行给的 > 直播伴侣检测（find_room --webcast-mate，macOS / Windows）> 下面的 default_room。
; 填你自己的抖音直播间房间号（web_rid / room_id）；留空则只靠直播伴侣检测 / 命令行参数 ./live.sh <房间号或链接>
default_room =
detect_room = true
; 自动打开 1920×1080 直播窗口（已经有页面连着服务就不重复开）/ 打印自检清单（音频设备 / TTS / LLM / 直播间 / 音乐 / 浏览器 / 手机面板；TTS 和 LLM 会各真调用一次）
window = true
health = true

; ---- 抓取器：断线重连 / 开播下播 ----
; watch：看门狗总开关（自动切换房间）。live_gate：没开播就不连 WebSocket，每 live_poll_secs 秒查一次，开播后自动连（false = 老行为，没开播也连）。
; autoswitch：默认房间没开播时，每隔几分钟看一眼直播伴侣日志，如果它的当前房间正在直播且不是默认房间，就切过去并通知页面（只在 macOS / Windows 有效）。
; keep_room：常驻房间不因为「没有页面」被断开（没有页面时日志和复盘也要继续）。
watch = true
live_gate = true
live_poll_secs = 30
autoswitch = true
keep_room = true
; 出错重连：等 backoff_min 秒起，翻倍到 backoff_max；连上超过 30 秒再断就从头算。stale_secs：连着但这么多秒没收到任何数据（包括心跳）就当断了重连，0 = 不检测。
backoff_min = 3
backoff_max = 60
stale_secs = 60
; 服务看门狗（tools/supervisor.py，./live.sh 自带）：崩溃后等 sup_delay 秒重启，翻倍到 30；连续 sup_max_crashes 次「刚启动就崩」放弃。活过 60 秒算稳定。
sup_delay = 3
sup_max_crashes = 8

; ---- 日志：每场直播一个 data/logs/session-<时间>.jsonl（一行一个事件：弹幕 / 礼物 / 点赞 / 关注 / 歌 / 投票 / 游戏 / agent / 主播发言 / 错误），外加 server.log ----
; 单个文件超过 log_max_mb 就轮转，最多留 log_files 个旧文件；超过 log_keep_days 天的删掉。log_members：是否记进场（量很大，默认不记）。log_text_chars：弹幕只记前多少字。
; 一场 = 开播到下播；下播后等 end_grace 秒（期间又有互动算同一场）；session_gap 秒没有任何事件也算结束。data/ 已被 .gitignore 忽略；日志里有观众昵称和弹幕原文，别外传。
log = true
log_dir = data/logs
log_max_mb = 10
log_files = 5
log_keep_days = 30
log_members = false
log_text_chars = 200
session_gap = 1800
end_grace = 60

; ---- 下播复盘：data/reports/report-<场次>.html（网页）/ .md（Markdown）/ .json；XP 桌面「开始 → 所有程序 → 直播复盘」里也能看，面板里能「现在生成」----
; report_on_end：一场结束自动生成（短于 report_min_secs 秒的不出）。report_llm：让 AI 主播写一小段复盘（只用汇总数据；失败就只出数据报告）。
; diamond_rmb：1 抖币折多少元（抖音 10 抖币 = 1 元）。注意这是礼物标价，不是主播实际收入。report_top：各榜单列几个。
report = true
report_dir = data/reports
report_on_end = true
report_llm = true
report_min_secs = 60
diamond_rmb = 0.1
report_top = 5

; ---- 手机控制面板：http://<电脑局域网 IP>:8765/panel（同一个 Wi-Fi 的手机打开；必须有令牌）----
; panel_lan：监听 0.0.0.0 让手机能连；此时除 /panel 和 /ops/api 外，其它路径（弹幕页 / ws / 测试接口…）只放行本机（403）。false = 只在本机。
; 令牌：自动生成到 panel_token_file（权限 600），不会打印在日志里；想固定就在 panel_token 里写一个（优先），换令牌 = 删文件重启。
; 连续 5 次令牌错误的 IP 锁定 panel_fail_lock 秒。panel_recent：弹幕页显示多少条；panel_say_max：「让主播说」最多多少字。
; qr：开播清单里画二维码（不含令牌；带令牌的用 python tools/opsctl.py panel-qr）。面板改的开关存 overrides_file，下次启动还在，面板里可以「还原为 config.ini」。
panel = true
panel_lan = true
panel_token =
panel_token_file = data/ops_token.txt
panel_recent = 60
panel_say_max = 60
panel_fail_lock = 60
qr = true
overrides_file = data/ops_overrides.json

[guard]
; ================= 真人验证守护（只通知，绝不操作直播伴侣）=================
; 抖音会不定期在直播伴侣里弹「人机交互弹窗」（真人验证 / 主播是否在线），限时（日志里 timeout=120 秒）不处理就会被平台关播。
; 这里盯着直播伴侣的日志（只读），一出现就：Bark 推送到 iPhone + Mac 提示音（只走实体音箱，不进直播）+ 手机面板顶部红条。
; 也会在「直播中突然下播而且不是自己点的结束」时提醒。密钥在 data/bark_key.txt（不要提交 / 不要发给别人）。手机面板「开关」页第一组可以随时开关，「控制」页有「测试推送」。
enabled = true
; ---- Bark ----
bark = true
bark_key_file = data/bark_key.txt
bark_server = https://api.day.app
bark_group = qq-live
bark_title = GG-Bond 直播
; critical = 静音 / 勿扰也响；失败会自动降级成 timeSensitive 再试一次
bark_level = critical
bark_timeout = 8
; ---- Mac 提示音 ----
sound = true
sound_file = /System/Library/Sounds/Sosumi.aiff
sound_repeat = 4
; auto = 所有实体音箱（自动排除 BlackHole / 直播多输出 / 显示器）；也可以写设备名，逗号分隔，例如 EDIFIER,扬声器。虚拟设备永远不会发声（免得进直播）
sound_device = auto
; ---- 信号 1：直播伴侣日志（只读）----
log_watch = true
; auto = macOS ~/Library/Logs/Douyin Webcast Mate
log_dir = auto
log_poll = 1
; 服务启动时往回看多久：还在倒计时的弹窗 / 刚被平台关播而没提醒过的，补发一次
catchup_secs = 1800
; 自己加关键字：日志行匹配这些正则就提醒，分号分隔。例如 captcha_shown;anti_addiction
extra_patterns =
; ---- 信号 2：窗口兜底（macOS）。auto = 只在读不到日志时启用；true 总是启用；false 关闭 ----
window_watch = auto
; 窗口检查间隔（秒）
interval = 10
window_owners = 抖音直播伴侣,Douyin Webcast Mate,直播伴侣
; ---- 提醒节奏 ----
; 同一种提醒的冷却（秒）：不会刷屏
cooldown = 60
; 验证弹窗出现后第 50、90 秒还没点「我已处理」就再提醒一次（留空 = 不重复提醒）
remind_at = 50,90
; ---- 信号 3：弹幕抓取器发现下播 ----
drop_alert = true
; 发现下播后等几秒，看日志是不是自己点的结束（是就不提醒）
drop_grace = 15
state_file = data/guard_state.json

[tips]
; ================= 玩法提示：观众不知道能发什么弹幕 =================
; 安静（idle_secs 秒没人发弹幕，沿用 [idle] 的「观众上次说话」计时）时，往 QQ 群聊里发一条系统消息样式的玩法提示，例如
; 「💡 玩法提示：发弹幕『打开红警』，猪猪侠就会帮你打开」；23 条内置提示轮着发，**一轮里不重复**，发完才开始下一轮。
; 每条提示的命令都对规则解析器验证过，运行时还会按当前开关 / 桌面状态再校验（点歌没开、窗口不存在的会先跳过）。
; 有时（demo_chance）猪猪侠真的演示一遍（光标会动，走 [idle] 的玩电脑活动 / 烟花流星雨），演完说一句并发「刚才这个你们也能玩，发『玩扫雷』试试」。
; 演示只用安全、短的活动（扫雷 / 纸牌 / 换壁纸 / 画画 / 记事本 / 计算器 / 喂宠物 / 抖一抖 / 排行榜 / 烟花 / 流星雨），不演示蓝屏。
; 手机面板：「开关」页有一组，「控制」页有「发一条玩法提示 / 发玩法菜单 / 演示一个」按钮。
enabled = true
; 多少秒没人发弹幕才算安静
idle_secs = 40
; 两条提示之间至少隔多少秒（随机 ×0.85~1.3）；任何两条（提示 / 演示 / 菜单）之间至少隔 min_gap 秒，不刷屏
interval = 150
min_gap = 90
; 服务启动后多久才开始发
startup_delay = 60
; 有演示的那几条提示，有多大概率换成「真的演示一遍」；demo = false 关掉演示
demo = true
demo_chance = 0.35
; 玩法菜单：每隔 menu_interval 秒发一条（不管安不安静，但不会打断投票 / 小游戏 / 主播说话）；menu_size 条命令；menu_items 自己写（用 | 或逗号分隔，留空 = 从可用命令里轮流挑）
menu = true
menu_interval = 480
menu_size = 6
menu_items =
; 演示后的「你们也能玩」让猪猪侠说出来（很短的一句，走 TTS）；false = 只发文字
use_tts = true
; 内置的 23 条提示要不要用；custom 自己加提示文字（用 | 分隔，会加上前缀；写在这里的文字不会被验证）
builtin = true
custom =
prefix = 💡 玩法提示：
state_file = data/tips_state.json


[autoclose]
; ================= 窗口闲置自动关闭（web/autoclose.js）=================
; 猪猪侠 / 冷场活动 / 观众指令打开的窗口，没人碰了就自动收掉（别让画图、记事本一直盖着桌面和群聊）。
; 「碰」= 用户或 agent 的点击 / 按键 / 滚轮、agent 正在对它做动作、视频在放；agent 正在做事、有菜单开着、有模态对话框、开机 / 关机 / 蓝屏画面时先等着；最小化的不动。
; 关的时候放 XP 风格的收缩动画（往任务栏缩），不弹「要保存吗」，主播不说话。手机面板「开关」页可以随时开关（不用刷新页面）。
enabled = true
; 没写到的软件用这个（秒）；check_secs = 多久检查一次
default_secs = 40
check_secs = 2
anim = true
; 各软件的闲置秒数（0 = 不自动关）：画图（画完后）/ 记事本 / 计算器 / 命令提示符 / 控制面板 / 资源管理器 / IE / QQ 系（空间·QQ秀·宠物·群共享·登录·聊天记录）/ 小对话框 / 影音播放器（放完后）
paint = 25
notepad = 35
calc = 30
cmd = 35
control = 40
explorer = 40
ie = 40
qq = 40
dialog = 30
media = 40
; 游戏：最后一次互动后多久关；videogame = 红警 / CS / 魔兽 / 传奇 / 劲舞团这些视频演示（循环播放，所以主要靠 max_game）
minesweeper = 45
solitaire = 45
freecell = 45
videogame = 45
; 最长开多久（秒，不管有没有互动）：游戏 / 影音播放器 / 其它（max_any，0 = 不限）
max_game = 150
max_media = 180
max_any = 0
; 永远不动的窗口 id（群聊 / 千千静听 / 播放列表 / 桌面歌词 / QQ 面板 / QQ 宠物 / 直播复盘 / 关机·注销·系统画面）；skip = 自己会关的（投票 / 切歌投票 / 趣味小游戏）
keep = qqchat,ttplayer,ttplaylist,lyrics,qq-panel,qqx-pet,report,shutdown,logoff,shutter,xpscr
skip = vote,skipvote,game

[perform]
; ================= 冷场「表演」（backend/agent/perform.py）=================
; 冷场时猪猪侠先说一句开场白（TTS + 群聊里就是他说的这句），再走 agent 管线真的做一遍，最后补一句「💡 你们也可以发『来个蓝屏』」。
; 是 [idle] 的活动（perf_<id>）：随机挑，观众一开口立刻打断，受 [idle] 的间隔 / 每小时上限管。
; 内置 10 个：bsod 蓝屏 / restart 重启（页面里的 XP 假重启：关机画面 → 开机画面 → 回桌面，不碰真实电脑）/ virus 熊猫烧香 / fireworks 烟花 / meteor 流星雨 /
; mine 扫雷 / paint 画画（画完留着，由 [autoclose] 过一会儿关）/ wall 换壁纸 / shake 抖窗口 / pet 喂 QQ 宠物。
; 面板：「开关」页有「冷场表演」和「表演后补一句」，「控制」页有「来一场表演」按钮（马上演一场，不看开关 / 间隔）。
enabled = true
; 权重（和 [idle] 的其它活动一起抽；写 id:权重，0 = 不演；留空 = 默认 bsod:0.4,restart:0.3,virus:0.5,fireworks:1,meteor:0.5,mine:1,paint:1,wall:0.7,shake:0.6,pet:0.7）
weights =
; 任意两场表演之间至少隔多少秒；蓝屏 + 重启（整个屏幕变样的）两场之间至少隔 heavy_gap 秒（默认 10 分钟，共用）
gap = 240
heavy_gap = 600
; 表演后补一句「你们也可以发『…』」（群聊系统消息）
tip = true
; 自定义台词：「台词=动作」用 | 分隔，动作是上面的 id；同一个动作可以写多句（随机一句）；留空 = 用内置台词
; 例：给大家表演一个蓝屏=bsod|电脑太卡了，我重启一下=restart
items =
; false = 只演 items 里写了的
builtin = true


[welcome]
; ================= 进场接待（backend/agent/welcome.py）=================
; 观众进直播间：主播在 QQ 群聊里欢迎一句，顺带推荐一个他**还没用过**的玩法口令，例如
;   新观众「欢迎 小明 来到直播间～发『来个蓝屏』试试」；老观众「小明 又来啦，第 3 次了～发『放烟花』试试」（第几次 = 来过的不同日子数，存在 data/play.json 的用户记录里）；
;   关注过的老朋友（giftfx）换亲切一点的说法。口令用过没有：看这个人发过的弹幕里有没有那个口令的关键词。
; 防刷屏：merge_secs 秒内进来的合并成一句「欢迎 A、B 等 3 位朋友～」；同一个人 user_gap 秒内最多欢迎一次；每分钟最多 max_per_min 句。
; 默认只发文字；speak = quiet：房间安静（quiet_secs 秒没人发弹幕、主播没在说话、没在玩电脑）才用 TTS 念；never = 永远只发文字；always = 都念。
; 进场事件不会打断冷场玩电脑。开着本模块时，主播自己的「欢迎新人」和 ai6 的「老观众欢迎」会让位。手机面板「开关」页有总开关。
enabled = true
merge_secs = 10
user_gap = 1800
max_names = 2
max_per_min = 6
pending_max = 12
speak = quiet
quiet_secs = 60
; 推荐口令：recommend = false 就只欢迎不推荐；cmds = 候选口令 id（见 backend/agent/tips.py 的 TIPS，逗号分隔）
recommend = true
cmds = song,bsod,fw,meteor,virus,shake,pet,wall,mine,paint,rank,sol,idiom,songgame,riddle
; 自己写台词（用 | 分隔多条随机；{n}=昵称 {k}=第几次/人数）；留空 = 内置。tail 是推荐口令的尾巴，{cmd}=口令
tpl_new =
tpl_back =
tpl_friend =
tpl_group =
tail =

[giftfx]
; ================= 礼物 / 点赞联动（backend/agent/giftfx.py + web/giftfx.js）=================
; 按**钻石价值**（不是礼物名）分档：
;   tier1（1 钻起）  小烟花 + 主播一句感谢
;   tier2（10 钻起） 一场随机「冷场表演」（蓝屏 / 烟花 / 流星雨 / 熊猫烧香 / 扫雷 / 画画…）；送礼的人在 ask_secs 秒内发『烟花』『蓝屏』…就演他点的（这句弹幕被吃掉）
;   tier3（100 钻起）大场面：假「重装系统」（XP 安装画面 → 开机 → 欢迎 → 桌面，只在页面里演）或 流星雨 + 全屏感谢卡片，并标记成高光（切片用）
; 点赞：本场累计每 like_step 个赞 → 全屏点赞特效 + 主播念谢谢。关注：主播点名感谢 + 记进好友列表（积分存档里 friend=true，[welcome] 用亲切的说法欢迎）。
; 礼物触发的表演不看 [perform] 的开关 / gap（会打断正在玩的冷场活动），但蓝屏 / 重启 / 重装仍受 [perform] heavy_gap（10 分钟）限制；做完不补「你们也可以发」。
; 连击合并：同一个人 merge_secs 秒内的礼物（含抖音连击累计数）合成一次，按总钻石数定档；队列最多 queue_max 个、一次只放一个，满了丢最低档的。
; 钻石数为 0 / 没有的礼物不归这里管（主播自己感谢 + [qq] gift_map 映射照旧）。手机面板：「开关」页「礼物 / 点赞联动」，「控制」页有四个测试按钮。
enabled = true
; 各档单独开关 / 门槛（钻石数）
t1 = true
t2 = true
t3 = true
tier1 = 1
tier2 = 10
tier3 = 100
merge_secs = 3
ask_secs = 30
queue_max = 4
gap_secs = 3
; 大场面：random（重装系统 / 流星雨 随机）| setup | meteor
big_scene = random
likes = true
like_step = 300
follow = true
; 感谢的话让主播说出来（TTS；false = 只在群聊里发文字）
speak = true

[clips]
; ================= 高光切片（backend/clips.py）=================
; Mac 上用 ffmpeg 一直录「直播页面所在的浏览器窗口」+ BlackHole 的声音，存成滚动的几十秒分段缓冲（系统临时目录，低 CPU：h264_videotoolbox）；
; 出高光（蓝屏 / 熊猫烧香 / 假重启 / 烟花 / 流星雨表演、大礼、观众发「高光」）就把「前 pre 秒 + 后 post 秒」剪成 9:16 竖屏 MP4（模糊铺底）存到 data/clips/<时间>_<事件>.mp4。
; 只在「开播中」录（mode=live）；mode=always 一直录；mode=manual 只在面板手动开录时录。手机面板有「切片」页：看 / 删 / 现在切一个 / 手动开关录制。
; 第一次要在 macOS「系统设置 → 隐私与安全性 → 屏幕与系统音频录制」里给启动本服务的 App（或 python 可执行文件）开权限：服务启动 / 开录时会自动检测，
; 没权限就不录，日志和面板「切片」页会写清楚该给谁开（不会弹窗、也不会想办法绕过）。开完要重启服务。
enabled = true
mode = live
; ffmpeg 路径：auto = /opt/homebrew/bin/ffmpeg → /usr/local/bin/ffmpeg → PATH
ffmpeg = auto
; 录制：帧率 / 最大宽度（超过就缩小）/ 码率 kbps / 编码器（auto = h264_videotoolbox，没有就 libx264）
fps = 20
max_width = 1280
bitrate = 3500
encoder = auto
; 声音来源（avfoundation 音频设备名，包含这段字就行）；留空 = 只录画面
audio = BlackHole 2ch
; 找直播窗口：窗口所属 App + 标题里含的字（页面标题是「<主播名> 的直播间 - 群聊」）。找不到就不录（不会乱猜）。
window_owner = Google Chrome
window_title = 直播间
; 手动指定区域（全局坐标，点）：x,y,w,h；留空 = 自动找窗口。inset = 上,右,下,左（点）：从窗口里再往里缩，用来去掉浏览器的标签栏 / 地址栏
region =
inset = 0,0,0,0
; 分段 / 缓冲：每段 seg_secs 秒；只留 keep_secs 秒（至少要盖住 pre + post）
seg_secs = 2
keep_secs = 45
; 前 / 后各剪多少秒；min_gap 秒内的几个高光合并成一条
pre = 10
post = 15
min_gap = 20
; 哪些高光要剪：perf_bsod perf_restart perf_virus perf_fireworks perf_meteor（冷场表演）、gift_big（100 钻大礼）、viewer（观众点的）
events = perf_bsod,perf_restart,perf_virus,perf_fireworks,perf_meteor,gift_big,viewer
; 观众发「高光 / 切片 / 剪辑」（12 字以内的短弹幕，正则）就切一个；同一人 viewer_gap 秒一次；reply = 群聊里回一句「这一段我切下来了」
viewer_cmd = true
viewer_kw = 高光|切片|剪辑|clip
viewer_gap = 120
reply = true
; 保存：目录 / 最多留几条 / 竖屏（false = 保持原比例）/ 竖屏尺寸和码率
out_dir = data/clips
max_clips = 80
vertical = true
out_w = 1080
out_h = 1920
out_bitrate = 5000
; 剪好后 Bark 推送到手机（默认关；密钥用 [guard] 的 bark_key_file）
bark = false
bark_text = 切到一个高光
; 窗口移动 / 改大小后多久重新对准一次；录制失败多久重试
relocate_secs = 30
retry_secs = 20
; 仅测试 / 演示：lavfi（彩条）或 image:<图片路径>，代替真实抓屏（不碰屏幕录制权限）
test_source =

[story]
; 连续剧情 + 观众记忆：XP 里的日期从 start_date 起每个「开播日」往后走一天（任务栏时钟悬停 / 点开日历，QQ空间日志 / 留言的日期跟着变）；
; 下播后用这一场的高光 / 活跃观众写一篇 QQ空间日记（LLM，没配就用模板），下次开播时发表，冷场时猪猪侠会翻出来念；观众记忆（visits / 常用口令 / 几句短弹幕）用在欢迎词和回弹幕里
